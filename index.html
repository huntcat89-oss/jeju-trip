*{box-sizing:border-box}

 background:#fff;color:#1c1c1a;cursor:pointer}

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){
 var enc=new TextEncoder();
 var km=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
   km,{name:"AES-GCM",length:256},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
 return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function go(pw,fromCache){
 try{
  var html=await unlock(pw);
  try{sessionStorage.setItem("jeju_pw",pw);}catch(e){}
  show(html);
 }catch(e){
  try{sessionStorage.removeItem("jeju_pw");}catch(_){}
  if(!fromCache)document.getElementById("err").textContent="비밀번호가 올바르지 않습니다.";
 }
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();go(document.getElementById("pw").value,false);});
(function(){try{var c=sessionStorage.getItem("jeju_pw");if(c)go(c,true);}catch(e){}})();
